# 叠加 docker-compose.prod.yml：OCR 容器 Nginx 仅 127.0.0.1:9080 HTTP，TLS 由宿主机 Nginx 处理。
#
# docker compose --env-file .env.production \
#   -f docker-compose.prod.yml -f docker-compose.host-proxy.ocr.yml up -d --build

services:
  web:
    # 覆盖 base 的 80/443 公网映射（Compose 2.24+）；旧版 compose 若仍占 80，见 deploy/同机双站-宿主机Nginx.md
    ports:
      - !reset
      - "127.0.0.1:9080:80"
    environment:
      CERTBOT_DOMAIN: none
