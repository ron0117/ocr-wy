name: ocr-platform

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      PORT: "3000"
      WEB_ORIGIN: ${WEB_ORIGIN}
      WECOM_CORP_ID: ${WECOM_CORP_ID}
      WECOM_AGENT_ID: ${WECOM_AGENT_ID}
      WECOM_SECRET: ${WECOM_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      STORAGE_DRIVER: local
      LOCAL_STORAGE_DIR: /app/data/storage
      AI_BASE_URL: ${AI_BASE_URL:-http://host.docker.internal:48760/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      SEED_DATABASE: ${SEED_DATABASE:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app_storage:/app/data/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/v1/health"]
      start_period: 60s
      interval: 15s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    restart: unless-stopped
    environment:
      CERTBOT_DOMAIN: ${CERTBOT_DOMAIN:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      # 备案完成前不对外开放 443。备案后取消下一行注释。
      # - "${HTTPS_PORT:-443}:443"
    volumes:
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    depends_on:
      api:
        condition: service_healthy

  # 备案完成前不续期证书。备案后取消本段注释。
  # certbot:
  #   image: certbot/certbot:v3.1.0
  #   restart: unless-stopped
  #   volumes:
  #     - certbot_www:/var/www/certbot
  #     - letsencrypt:/etc/letsencrypt
  #   entrypoint: /bin/sh -c
  #   command:
  #     - |
  #       trap exit TERM
  #       while :; do
  #         certbot renew --webroot -w /var/www/certbot --quiet || true
  #         sleep 12h &
  #         wait $$!
  #       done
  #   depends_on:
  #     web:
  #       condition: service_started

volumes:
  postgres_data:
  app_storage:
  certbot_www:
  letsencrypt:
