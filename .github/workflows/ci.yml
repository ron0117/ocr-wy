name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build OCR (shared-types, api, web)
        run: pnpm build

      - name: Build Guide (wiki)
        env:
          # prisma generate 仅需合法 URL，不连库；无 .env 时用 example 默认值
          GUIDE_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/guide?schema=public
        run: pnpm build:guide

      - name: API self-check
        run: pnpm check
