name: Deploy

on:
  workflow_dispatch:
    inputs:
      stack:
        description: 部署目标
        type: choice
        options:
          - both
          - ocr
          - guide
        default: both
  # main 上 CI 成功后再部署（避免 push 同时跑两套、也避免 CI 未过就上线）
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          STACK: ${{ github.event_name == 'workflow_dispatch' && inputs.stack || 'both' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_BRANCH: ${{ secrets.DEPLOY_BRANCH }}
          SKIP_BUILD: ${{ github.event_name == 'workflow_run' && '1' || '0' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 90m
          envs: STACK,DEPLOY_PATH,DEPLOY_BRANCH,SKIP_BUILD
          script: |
            set -Eeuo pipefail
            path="${DEPLOY_PATH:-/opt/ocr-wy}"
            branch="${DEPLOY_BRANCH:-main}"
            export SKIP_BUILD="${SKIP_BUILD:-0}"
            if [[ ! "$path" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
              echo "DEPLOY_PATH 不安全: $path" >&2
              exit 1
            fi
            if [[ ! -d "$path/.git" ]]; then
              echo "未找到 Git 仓库: $path（请先在服务器 clone，见 deploy/github-actions-部署说明.md）" >&2
              exit 1
            fi
            cd "$path"
            git fetch origin "$branch"
            git checkout "$branch"
            git merge --ff-only "origin/$branch"
            sed -i 's/\r$//' deploy/bootstrap-dual-host-centos.sh deploy/deploy-common.sh 2>/dev/null || true
            case "${STACK:-both}" in
              ocr)
                bash deploy/bootstrap-centos.sh
                ;;
              guide|both)
                bash deploy/bootstrap-dual-host-centos.sh
                ;;
              *)
                echo "未知 STACK: $STACK" >&2
                exit 1
                ;;
            esac
