name: guide-wiki

services:
  postgres-guide:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${GUIDE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${GUIDE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${GUIDE_POSTGRES_DB}
    volumes:
      - postgres_guide_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30

  guide-api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.guide-api
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    restart: unless-stopped
    environment:
      GUIDE_DATABASE_URL: postgresql://${GUIDE_POSTGRES_USER}:${GUIDE_POSTGRES_PASSWORD}@postgres-guide:5432/${GUIDE_POSTGRES_DB}?schema=public
      GUIDE_API_PORT: "3001"
      GUIDE_WEB_ORIGIN: ${GUIDE_WEB_ORIGIN}
      GUIDE_ADMIN_TOKEN: ${GUIDE_ADMIN_TOKEN:-}
      SEED_GUIDE: ${SEED_GUIDE:-false}
    depends_on:
      postgres-guide:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/api/v1/health"]
      start_period: 90s
      interval: 15s
      timeout: 5s
      retries: 20

  guide-app:
    build:
      context: .
      dockerfile: deploy/Dockerfile.guide
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    restart: unless-stopped
    environment:
      PORT: "3000"
      GUIDE_API_URL: http://guide-api:3001
    depends_on:
      guide-api:
        condition: service_healthy

  guide-proxy:
    build:
      context: .
      dockerfile: deploy/Dockerfile.guide-proxy
    restart: unless-stopped
    environment:
      GUIDE_CERTBOT_DOMAIN: ${GUIDE_CONTAINER_CERTBOT_DOMAIN:-${GUIDE_CERTBOT_DOMAIN:-}}
    ports:
      - "${GUIDE_PUBLISH_HTTP:-${GUIDE_HTTP_PORT:-8080}:80}"
      - "${GUIDE_PUBLISH_HTTPS:-${GUIDE_HTTPS_PORT:-8443}:443}"
    volumes:
      - certbot_guide_www:/var/www/certbot
      - letsencrypt_guide:/etc/letsencrypt
    depends_on:
      guide-app:
        condition: service_started
      guide-api:
        condition: service_healthy

  certbot-guide:
    image: certbot/certbot:v3.1.0
    restart: unless-stopped
    volumes:
      - certbot_guide_www:/var/www/certbot
      - letsencrypt_guide:/etc/letsencrypt
    entrypoint: /bin/sh -c
    command:
      - |
        trap exit TERM
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet || true
          sleep 12h &
          wait $$!
        done
    depends_on:
      guide-proxy:
        condition: service_started

volumes:
  postgres_guide_data:
  certbot_guide_www:
  letsencrypt_guide:
