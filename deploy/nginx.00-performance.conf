# 位于 http {} 内（conf.d 引入）。Docker 与宿主机均可复制为 conf.d/00-performance.conf
# sendfile / keepalive 等由 nginx 主配置提供，此处只补充压缩与版本隐藏

server_tokens off;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_buffers 16 8k;
gzip_http_version 1.1;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/xml+rss
    application/vnd.ms-fontobject
    application/wasm
    image/svg+xml
    font/woff
    font/woff2;
